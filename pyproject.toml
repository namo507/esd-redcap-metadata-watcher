[tool.pytest.ini_options]
# Source lives under shared/ and projects/<name>/ rather than the repository
# root, so make those directories importable for the test suites.
pythonpath = [
    "shared",
    "projects/redcap-metadata-watcher",
    "projects/nano-nico-recruitment",
    "projects/caregiver-cluster-analysis",
]
testpaths = [
    "shared/tests",
    "projects/redcap-metadata-watcher/tests",
    "projects/nano-nico-recruitment/tests",
    "projects/caregiver-cluster-analysis/tests",
]
