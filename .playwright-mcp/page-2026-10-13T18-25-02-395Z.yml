      - generic [ref=e30]:
        - paragraph [ref=e31]: REDCap is a secure web platform for building and managing online databases and surveys. REDCap's streamlined process for rapidly creating and designing projects offers a vast array of tools that can be tailored to virtually any data collection strategy.
        - paragraph [ref=e32]: REDCap provides automated export procedures for seamless data downloads to Excel and common statistical packages (SPSS, SAS, Stata, R), as well as a built-in project calendar, a scheduling module, ad hoc reporting tools, and advanced features, such as branching logic, file uploading, and calculated fields.
        - paragraph [ref=e33]:
          - text: Learn more about REDCap by watching a
          - link "brief summary video (4 min)" [ref=e35] [cursor=pointer]:
            - /url: javascript:;
          - text: . If you would like to view other quick video tutorials of REDCap in action and an overview of its features, please see the
          - link "Training Resources" [ref=e36] [cursor=pointer]:
            - /url: /index.php?action=training
          - text: page.
        - paragraph [ref=e37]: "NOTICE: If you are collecting data for the purposes of human subjects research, review and approval of the project is required by your Institutional Review Board."
        - paragraph [ref=e38]:
          - text: If you require assistance or have any questions about REDCap, please contact
          - link "REDCap Administrator (ORHSREDCap@mailbox.sc.edu)" [ref=e39] [cursor=pointer]:
