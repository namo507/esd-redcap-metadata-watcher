name: Visitboard backend

# Tests the scheduling engine and API, then deploys the container.
#
# The tests are a gate on purpose: this engine decides who is sent to a family
# visit, and a broken build reaching the lab is worse than no deploy.
#
# Deploying needs one repository secret, FLY_API_TOKEN. Without it the job
# tests and stops, which is exactly what you want if you chose Render instead:
# Render deploys from its own GitHub hook on every push, so this workflow is
# only ever a gate there and no secret is involved.

on:
  push:
    branches: [main]
    paths:
      - 'projects/Weighted Visit Assignment/backend/**'
      - 'projects/Weighted Visit Assignment/esd_scheduler/**'
      - 'projects/Weighted Visit Assignment/tests/**'
      - 'projects/Weighted Visit Assignment/config/**'
      - 'projects/Weighted Visit Assignment/requirements*.txt'
      - 'projects/Weighted Visit Assignment/Dockerfile'
      - 'projects/Weighted Visit Assignment/fly.toml'
      - 'render.yaml'
      - '.github/workflows/visitboard-backend.yml'
  pull_request:
    paths:
      - 'projects/Weighted Visit Assignment/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visitboard-backend
  cancel-in-progress: false

defaults:
  run:
    working-directory: 'projects/Weighted Visit Assignment'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The engine and the API run on the standard library. Installing the
      # calendar-reading extras as well means the upload tests run for real
      # rather than skipping, which is where the awkward bugs have been.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-core.txt
          python -m pip install -r requirements-optional.txt || \
            echo "optional extras unavailable; those tests will skip"

      # Two things the suite cannot check from inside itself: that every
      # third-party import is listed in a requirements file, and that the
      # board still starts with the optional packages blocked. The second is
      # what the container depends on -- it installs requirements-core.txt
      # only, so an import moving to the top of a module breaks the image
      # while every test on this laptop still passes.
      - name: Check dependencies are declared and the core-only path works
        run: make doctor

      - name: Run the test suite
        run: make test

      # Building here catches a broken Dockerfile before deploy rather than
      # during it.
      - name: Build the image
        run: docker build -t esd-visitboard:ci .

      - name: Check the container actually serves
        run: |
          docker run -d --name ci -p 8080:8080 esd-visitboard:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/health >/dev/null; then
              echo "healthy after ${i}s"; break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/api/health | head -c 200
          echo
          # The page is served from a different origin once deployed, so a
          # missing CORS header would break the live board while every test
          # above still passed.
          curl -fsS -D - -o /dev/null http://127.0.0.1:8080/api/board \
            | grep -i 'access-control-allow-origin' \
            || { echo "no CORS header on /api/board"; exit 1; }
          docker rm -f ci

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Is a Fly token configured?
        id: check
        run: |
          if [ -n "${{ secrets.FLY_API_TOKEN }}" ]; then
            echo "have_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_token=false" >> "$GITHUB_OUTPUT"
            echo "No FLY_API_TOKEN set, so nothing is deployed from here."
            echo "That is correct if you chose Render: it deploys from its own"
            echo "hook on every push and needs no secret."
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.check.outputs.have_token == 'true'

      - name: Deploy to Fly.io
        if: steps.check.outputs.have_token == 'true'
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
