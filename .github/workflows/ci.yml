name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Two files, because the suites need different things. requirements-dev
      # covers the shared modules and both REDCap projects; the caregiver
      # analysis brings its own scientific stack (scikit-learn, statsmodels,
      # shap, umap-learn) and its tests cannot even be collected without it.
      # Installing only the first is why a caregiver test failed here for
      # weeks with ModuleNotFoundError while passing on every laptop that had
      # run the notebooks.
      - name: Install development dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -r projects/caregiver-cluster-analysis/requirements.txt

      # Source moved into shared/ and projects/<name>/ when the workspace was
      # reorganised. The old flat list named files that no longer exist here,
      # so this step could never have compiled anything.
      - name: Compile Python sources
        run: >-
          python -m compileall -q
          shared
          projects/nano-nico-recruitment
          projects/redcap-metadata-watcher
          projects/caregiver-cluster-analysis

      - name: Check secret hygiene
        run: python -m pytest -q shared/tests/test_secret_hygiene.py

      # testpaths and pythonpath come from pyproject.toml, which already knows
      # where the suites live. Naming paths here again is how they drifted.
      - name: Run test suite
        run: python -m pytest -q --ignore=shared/tests/test_secret_hygiene.py
